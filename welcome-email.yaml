                  content: '<p style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.72;color:#2A2D35;font-weight:300;margin:0 0 18px 0;">Thanks for joining The Artist Platform.</p><p style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.72;color:#2A2D35;font-weight:300;margin:0 0 18px 0;">We''ve received your details and added you to the early access list — you''re now part of the initial group we''re building TAP with ahead of launch.</p><p style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.72;color:#2A2D35;font-weight:300;margin:0 0 18px 0;">We''re currently preparing for our August launch, and over the coming weeks we''ll be reaching out to guide you through building out your profile and getting set up on the platform.</p><p style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.72;color:#2A2D35;font-weight:300;margin:0;">You''ll also be kept up to date as we roll things out, share progress, and open up early opportunities. If you have any questions in the meantime, feel free to reply directly to this email.</p>'
